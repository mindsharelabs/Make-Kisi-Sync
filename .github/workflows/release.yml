name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -oP '(?<=Version:\s{5})\S+' make-kisi-sync.php || grep -oP "(?<=Version:\s{4})\S+" make-kisi-sync.php || grep -oP "(?<=Version:\s{3})\S+" make-kisi-sync.php || grep -oP "(?<=Version:\s{2})\S+" make-kisi-sync.php || grep -oP "(?<=Version:\s)\S+" make-kisi-sync.php)
          HEADER=$(php -r "
            \$src = file_get_contents('make-kisi-sync.php');
            preg_match('/^\s*\*\s*Version:\s+(\S+)/m', \$src, \$m);
            echo \$m[1] ?? '';
          ")
          echo "Tag version:    $TAG"
          echo "Header version: $HEADER"
          if [ "$TAG" != "$HEADER" ]; then
            echo "ERROR: tag ($TAG) does not match plugin header ($HEADER)"
            exit 1
          fi

      - name: Build plugin zip
        run: |
          mkdir -p dist/make-kisi-sync
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='CLAUDE.md' \
            --exclude='dist' \
            . dist/make-kisi-sync/
          cd dist
          zip -r make-kisi-sync.zip make-kisi-sync/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/make-kisi-sync.zip
